<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />

<title>술 달력</title>
<style>
:root{--bg:#F5F7FF;--card:#FFFFFF;--ink:#27304D;--muted:#6E7897;--line:#DDE3FA;--main:#6B7FFF;--main-dark:#4F61D8;--sub:#9D8BFF;--blue-soft:#D8F4FF;--purple-soft:#EAE5FF;--sober:#CFEFFF;--sober-ink:#216683;--drink:#FFC9D6;--drink-ink:#9B314D;--danger:#D45777;--shadow:0 14px 34px rgba(76,90,152,.14);--soft-shadow:0 8px 22px rgba(76,90,152,.1);--radius:14px;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 18px 18px,rgba(107,127,255,.06) 1px,transparent 1px),linear-gradient(180deg,#FBFCFF 0%,var(--bg) 58%,#EEF3FF 100%);background-size:26px 26px,auto;color:var(--ink)}button,input,select{font:inherit}button{border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}.app{width:min(100%,540px);min-height:100vh;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:15px}.title-block h1{margin:0;font-size:clamp(1.58rem,7vw,2rem);line-height:1.08;letter-spacing:0}.month-label{margin-top:7px;color:var(--muted);font-weight:800}.month-controls{display:grid;grid-template-columns:48px 48px;gap:9px;flex:0 0 auto}.icon-btn{width:48px;height:48px;border:1px solid var(--line);border-radius:13px;background:var(--card);color:var(--main-dark);font-size:1.36rem;font-weight:900;box-shadow:var(--soft-shadow)}.card{background:var(--card);border:1px solid rgba(221,227,250,.9);border-radius:var(--radius);box-shadow:var(--shadow)}.summary-card{padding:15px;margin-bottom:14px}.summary-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px}.summary-head span{color:var(--muted);font-weight:900;font-size:.84rem}.summary-comment{margin:0;color:var(--main-dark);font-weight:900;line-height:1.35;text-align:right}.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{min-height:78px;border:1px solid #E8ECFF;border-radius:13px;padding:11px;background:#FBFCFF}.stat.featured{background:linear-gradient(180deg,#F5F7FF,var(--purple-soft));border-color:#D5D8FF}.stat.streak{background:linear-gradient(180deg,#F7FBFF,var(--blue-soft));border-color:#BFEAFF}.stat-label{display:block;color:var(--muted);font-size:.78rem;font-weight:900;margin-bottom:6px}.stat-value{display:block;font-size:clamp(1.28rem,8vw,2rem);line-height:1.06;font-weight:950;color:var(--ink);overflow-wrap:anywhere}.stat small{display:block;margin-top:4px;color:var(--muted);font-weight:750;font-size:.74rem}.calendar-card,.pattern-card,.tools-card{padding:13px;margin-bottom:14px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-weight:950;font-size:.86rem;margin-bottom:10px}.money-main{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:12px;border-radius:13px;background:linear-gradient(135deg,var(--purple-soft),var(--blue-soft));margin-bottom:10px}.money-main span{color:var(--muted);font-weight:900;font-size:.82rem}.money-main strong{color:var(--ink);font-size:clamp(1.5rem,8vw,2.15rem);line-height:1;font-weight:950;text-align:right}.money-compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.compare-chip{min-height:42px;display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:#FBFCFF;color:var(--ink);padding:9px 10px;font-size:.86rem;font-weight:850;overflow-wrap:anywhere}.weekday-row,.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.weekday-row{margin-bottom:8px}.weekday-row div{text-align:center;color:var(--muted);font-size:.75rem;font-weight:950}.day{position:relative;aspect-ratio:1/1.05;min-width:0;padding:7px 5px 6px;border-radius:13px;border:1px solid #E9EDFF;background:#fff;color:var(--ink);display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;box-shadow:0 3px 8px rgba(76,90,152,.06)}.day.empty{opacity:0;pointer-events:none}.day.sober{background:var(--sober);border-color:#B5E7FA;color:var(--sober-ink)}.day.drink{background:var(--drink);border-color:#F5AFC0;color:var(--drink-ink)}.day.today{outline:3px solid rgba(107,127,255,.42);outline-offset:1px}.day-number{font-weight:950;font-size:.9rem}.day-mark{width:100%;font-size:.66rem;font-weight:950;color:inherit;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.segmented{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;border-radius:999px;background:#EEF2FF;border:1px solid var(--line)}.segmented button{min-height:38px;border-radius:999px;background:transparent;color:var(--muted);font-size:.82rem;font-weight:950}.segmented button.active{background:var(--main);color:#fff;box-shadow:0 6px 16px rgba(107,127,255,.28)}.chart-wrap{width:100%;overflow:hidden;border-radius:13px;background:#FBFCFF;border:1px solid var(--line);padding:8px}#patternChart{display:block;width:100%;height:170px}.tool-buttons{display:grid;grid-template-columns:1fr;gap:8px}.primary-btn,.secondary-btn,.danger-btn,.add-btn{min-height:50px;border-radius:13px;padding:12px 14px;font-weight:950;text-align:center}.primary-btn{background:var(--main);color:#fff;box-shadow:0 8px 18px rgba(107,127,255,.28)}.secondary-btn,.add-btn{background:#F4F6FF;color:var(--ink);border:1px solid var(--line)}.add-btn{width:100%;color:var(--main-dark)}.danger-btn{background:var(--danger);color:#fff}.file-input{display:none}.modal-backdrop{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;padding:16px;background:rgba(39,48,77,.4)}.modal-backdrop.open{display:flex}.modal{width:min(100%,540px);max-height:min(92vh,780px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:18px 18px var(--radius) var(--radius);box-shadow:0 24px 60px rgba(39,48,77,.25);padding:16px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.modal-head h2{margin:0;font-size:1.18rem;line-height:1.2}.close-btn{width:46px;height:46px;border-radius:13px;background:#F4F6FF;color:var(--ink);font-size:1.35rem;border:1px solid var(--line);font-weight:900}.status-toggle{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}.status-toggle button{min-height:54px;border-radius:13px;border:1px solid var(--line);background:#FBFCFF;color:var(--ink);font-weight:950}.status-toggle button.active.sober-choice{background:var(--sober);color:var(--sober-ink);border-color:#AEE3F8}.status-toggle button.active.drink-choice{background:var(--drink);color:var(--drink-ink);border-color:#F3AABE}.memo-field{margin-bottom:12px}.drink-fields{display:grid;gap:10px;margin-bottom:12px}.drink-item{border:1px solid var(--line);border-radius:14px;padding:11px;background:#FBFCFF;box-shadow:0 5px 14px rgba(76,90,152,.08)}.drink-item-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px;color:var(--main-dark);font-size:.88rem;font-weight:950}.item-delete-btn{min-height:38px;border-radius:11px;padding:8px 10px;background:#FFE8EF;color:var(--drink-ink);font-size:.82rem;font-weight:950;border:1px solid #FFC9D6;flex:0 0 auto}.item-grid{display:grid;grid-template-columns:1fr;gap:9px}label{display:grid;gap:6px;color:var(--muted);font-size:.82rem;font-weight:950}input,select{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);padding:10px 11px;outline:none}input:focus,select:focus{border-color:var(--main);box-shadow:0 0 0 3px rgba(107,127,255,.16)}.day-total{border:1px solid #D5D8FF;border-radius:14px;background:linear-gradient(135deg,#F7F8FF,var(--purple-soft));padding:12px}.day-total-title{color:var(--muted);font-weight:950;font-size:.84rem;margin-bottom:8px}.day-total-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.day-total-grid div{min-width:0;border-radius:11px;background:rgba(255,255,255,.68);padding:8px}.day-total-grid span{display:block;color:var(--muted);font-size:.7rem;font-weight:900;margin-bottom:4px}.day-total-grid strong{display:block;color:var(--ink);font-size:.94rem;font-weight:950;overflow-wrap:anywhere}.hint{margin:0;color:var(--muted);font-size:.78rem;line-height:1.4;font-weight:750}.modal-actions{display:grid;grid-template-columns:1fr;gap:8px}.empty-items{border:1px dashed var(--line);border-radius:13px;padding:13px;text-align:center;color:var(--muted);font-weight:850;background:#FBFCFF}.hidden{display:none!important}@media (min-width:480px){.app{padding-inline:20px}.tool-buttons{grid-template-columns:repeat(3,1fr)}.item-grid{grid-template-columns:1fr .55fr}.item-grid label:nth-child(1){grid-column:1/-1}.modal-actions{grid-template-columns:1fr 1fr}.modal-actions .primary-btn{grid-column:span 2}}
</style>
</head>
<body>
<main class="app">
<header class="topbar"><div class="title-block"><h1>🍺 술 달력</h1><div class="month-label" id="monthLabel"></div></div><nav class="month-controls" aria-label="월 이동"><button class="icon-btn" id="prevMonthBtn" type="button" aria-label="이전 달">‹</button><button class="icon-btn" id="nextMonthBtn" type="button" aria-label="다음 달">›</button></nav></header>
<section class="summary-card card" aria-label="월간 요약"><div class="summary-head"><span>이번 달 누적</span><p class="summary-comment" id="summaryComment"></p></div><div class="stat-grid"><div class="stat"><span class="stat-label">음주일 수</span><span class="stat-value" id="drinkingDays">0일</span></div><div class="stat"><span class="stat-label">총 술 개수</span><span class="stat-value" id="totalQuantity">0개</span></div><div class="stat featured"><span class="stat-label">총 술값</span><span class="stat-value" id="totalCost">0원</span></div><div class="stat featured"><span class="stat-label">총 칼로리</span><span class="stat-value" id="totalCalories">0kcal</span></div><div class="stat"><span class="stat-label">금주일 수</span><span class="stat-value" id="soberDays">0일</span></div><div class="stat"><span class="stat-label">평균 음주 간격</span><span class="stat-value" id="avgInterval">-</span><small>기록된 음주일 기준</small></div><div class="stat streak"><span class="stat-label">🏆 연속 금주일</span><span class="stat-value" id="soberStreak">0일</span><small>전체 기록 기준</small></div></div></section>

<section class="calendar-card card" aria-label="달력"><div class="weekday-row" aria-hidden="true"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="calendar-grid" id="calendarGrid"></div></section>
<section class="pattern-card card" aria-label="최근 6개월 음주 패턴"><div class="section-title"><span>최근 6개월 패턴</span><div class="segmented" aria-label="그래프 기준 선택"><button id="chartDaysBtn" class="active" type="button">음주일</button><button id="chartCostBtn" type="button">술값</button></div></div><div class="chart-wrap"><svg id="patternChart" viewBox="0 0 320 170" role="img" aria-label="최근 6개월 막대그래프"></svg></div></section>
<section class="tools-card card" aria-label="데이터 관리"><div class="section-title">백업과 복원</div><div class="tool-buttons"><button class="secondary-btn" id="exportBtn" type="button">기록 저장하기</button><button class="secondary-btn" id="importBtn" type="button">기록 불러오기</button><button class="danger-btn" id="resetBtn" type="button">전체 초기화</button></div><input class="file-input" id="importFile" type="file" accept="application/json,.json" /></section>
</main>
<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><section class="modal"><div class="modal-head"><h2 id="modalTitle">날짜 기록</h2><button class="close-btn" id="closeModalBtn" type="button" aria-label="닫기">×</button></div><div class="status-toggle" aria-label="상태 선택"><button id="soberBtn" class="sober-choice" type="button">금주</button><button id="drinkBtn" class="drink-choice" type="button">음주</button></div><label class="memo-field">메모<input id="memoInput" type="text" maxlength="80" placeholder="한 줄 메모"></label><div class="drink-fields" id="drinkFields"><div id="drinkItemList"></div><button class="add-btn" id="addDrinkItemBtn" type="button">+ 술 항목 추가</button><div class="day-total" aria-label="오늘 총합"><div class="day-total-title">오늘 총합</div><div class="day-total-grid"><div><span>총 술 개수</span><strong id="dayTotalQuantity">0개</strong></div><div><span>총 칼로리</span><strong id="dayTotalCalories">0kcal</strong></div><div><span>총 술값</span><strong id="dayTotalCost">0원</strong></div></div></div><p class="hint">기본 술값은 2026년 편의점 가격 기준으로 빠르게 입력되며, 항목별로 직접 수정할 수 있습니다.</p></div><div class="modal-actions"><button class="primary-btn" id="saveBtn" type="button">저장</button><button class="secondary-btn" id="deleteBtn" type="button">이 날짜 기록 삭제</button></div></section></div>
<script>const STORAGE_KEY="drink-calendar-records-v1";
const drinkCatalog={beer500:{label:"맥주 500ml · 카스",calories:210,price:3000},beer355:{label:"맥주 355ml · 카스",calories:150,price:2400},sojuBottle:{label:"소주 1병 · 참이슬프레시",calories:400,price:2100},sojuHalf:{label:"소주 반병 · 참이슬프레시",calories:200,price:1100},wineGlass:{label:"와인 1잔",calories:120,price:4500},makgeolli:{label:"막걸리 1병",calories:420,price:1900},other:{label:"기타",calories:0,price:0}};
const commentPool=["이번 달 꽤 선방 중.","간이 평화롭게 지내는 중.","술집 사장님이 서운해함.","지갑이 감사 인사를 전함.","생각보다 잘 버티는 중.","이번 달은 사람답다.","아직은 간이 파업하지 않음.","의외로 멀쩡한 달.","술보다 물을 더 마신 달.","달력이 조용히 증거를 모으는 중."];
const state={currentDate:new Date(),selectedKey:null,selectedStatus:"drink",selectedItems:[],chartMode:"days",records:loadRecords()};
const els={monthLabel:document.getElementById("monthLabel"),prevMonthBtn:document.getElementById("prevMonthBtn"),nextMonthBtn:document.getElementById("nextMonthBtn"),calendarGrid:document.getElementById("calendarGrid"),drinkingDays:document.getElementById("drinkingDays"),totalQuantity:document.getElementById("totalQuantity"),totalCost:document.getElementById("totalCost"),totalCalories:document.getElementById("totalCalories"),soberDays:document.getElementById("soberDays"),avgInterval:document.getElementById("avgInterval"),soberStreak:document.getElementById("soberStreak"),summaryComment:document.getElementById("summaryComment"),chartDaysBtn:document.getElementById("chartDaysBtn"),chartCostBtn:document.getElementById("chartCostBtn"),patternChart:document.getElementById("patternChart"),modalBackdrop:document.getElementById("modalBackdrop"),modalTitle:document.getElementById("modalTitle"),memoInput:document.getElementById("memoInput"),closeModalBtn:document.getElementById("closeModalBtn"),soberBtn:document.getElementById("soberBtn"),drinkBtn:document.getElementById("drinkBtn"),drinkFields:document.getElementById("drinkFields"),drinkItemList:document.getElementById("drinkItemList"),addDrinkItemBtn:document.getElementById("addDrinkItemBtn"),dayTotalQuantity:document.getElementById("dayTotalQuantity"),dayTotalCalories:document.getElementById("dayTotalCalories"),dayTotalCost:document.getElementById("dayTotalCost"),saveBtn:document.getElementById("saveBtn"),deleteBtn:document.getElementById("deleteBtn"),exportBtn:document.getElementById("exportBtn"),importBtn:document.getElementById("importBtn"),importFile:document.getElementById("importFile"),resetBtn:document.getElementById("resetBtn")};
init();
function init(){saveRecords();els.prevMonthBtn.addEventListener("click",()=>moveMonth(-1));els.nextMonthBtn.addEventListener("click",()=>moveMonth(1));els.closeModalBtn.addEventListener("click",closeModal);els.modalBackdrop.addEventListener("click",e=>{if(e.target===els.modalBackdrop)closeModal()});els.soberBtn.addEventListener("click",()=>setModalStatus("sober"));els.drinkBtn.addEventListener("click",()=>setModalStatus("drink"));els.addDrinkItemBtn.addEventListener("click",()=>addDrinkItem());els.drinkItemList.addEventListener("input",handleDrinkItemInput);els.drinkItemList.addEventListener("change",handleDrinkItemInput);els.drinkItemList.addEventListener("click",handleDrinkItemDelete);els.saveBtn.addEventListener("click",saveSelectedRecord);els.deleteBtn.addEventListener("click",deleteSelectedRecord);els.exportBtn.addEventListener("click",exportData);els.importBtn.addEventListener("click",()=>els.importFile.click());els.importFile.addEventListener("change",importData);els.resetBtn.addEventListener("click",resetAllData);els.chartDaysBtn.addEventListener("click",()=>setChartMode("days"));els.chartCostBtn.addEventListener("click",()=>setChartMode("cost"));render()}
// localStorage를 읽고 예전 단일 술 기록은 새 items 배열 구조로 자동 변환합니다.
function loadRecords(){try{const raw=localStorage.getItem(STORAGE_KEY);const records=raw?JSON.parse(raw):{};return normalizeImportedRecords(records)}catch(error){console.warn("기록을 읽지 못했습니다.",error);return {}}}
function saveRecords(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state.records))}
function moveMonth(delta){state.currentDate=new Date(state.currentDate.getFullYear(),state.currentDate.getMonth()+delta,1);render()}
function setChartMode(mode){state.chartMode=mode;els.chartDaysBtn.classList.toggle("active",mode==="days");els.chartCostBtn.classList.toggle("active",mode==="cost");renderPatternChart()}
function formatKey(date){const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,"0"),d=String(date.getDate()).padStart(2,"0");return `${y}-${m}-${d}`}
function parseDateKey(key){const [y,m,d]=key.split("-").map(Number);return new Date(y,m-1,d)}
function formatKoreanDate(key){const [y,m,d]=key.split("-").map(Number);return `${y}년 ${m}월 ${d}일`}
function formatMoney(value){return `${Math.round(value).toLocaleString("ko-KR")}원`}
function formatCount(value){const rounded=Math.round(Number(value||0)*10)/10;return Number.isInteger(rounded)?String(rounded):rounded.toFixed(1).replace(/\.0$/,"")}
function randomId(){return globalThis.crypto&&crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`}
function render(){const y=state.currentDate.getFullYear(),m=state.currentDate.getMonth();els.monthLabel.textContent=`${y}년 ${m+1}월`;renderCalendar(y,m);renderSummary(y,m);renderPatternChart()}// 선택된 월의 모든 날짜 버튼을 만들고 기록 상태에 따라 색을 입힙니다.
function renderCalendar(year,month){els.calendarGrid.innerHTML="";const firstDay=new Date(year,month,1).getDay(),daysInMonth=new Date(year,month+1,0).getDate(),todayKey=formatKey(new Date());for(let i=0;i<firstDay;i++){const empty=document.createElement("div");empty.className="day empty";els.calendarGrid.appendChild(empty)}for(let day=1;day<=daysInMonth;day++){const date=new Date(year,month,day),key=formatKey(date),record=state.records[key],button=document.createElement("button");button.type="button";button.className="day";if(record?.status==="sober")button.classList.add("sober");if(record?.status==="drink")button.classList.add("drink");if(key===todayKey)button.classList.add("today");button.setAttribute("aria-label",`${formatKoreanDate(key)} 기록 열기`);button.innerHTML=`<span class="day-number">${day}</span><span class="day-mark">${getDayMark(record)}</span>`;button.addEventListener("click",()=>openModal(key));els.calendarGrid.appendChild(button)}}
function getDayMark(record){if(!record)return "";if(record.status==="sober")return "금주";const totals=calculateRecordTotals(record);return totals.quantity>0?`${formatCount(totals.quantity)}개`:"음주"}
// 월간 합계를 계산해 숫자 요약과 코멘트를 갱신합니다.
function renderSummary(year,month){const prefix=`${year}-${String(month+1).padStart(2,"0")}`;const monthRecords=Object.entries(state.records).filter(([key])=>key.startsWith(prefix)).map(([key,record])=>({key,...record}));const drinkRecords=monthRecords.filter(r=>r.status==="drink"),soberRecords=monthRecords.filter(r=>r.status==="sober");const totals=drinkRecords.reduce((sum,record)=>{const t=calculateRecordTotals(record);sum.quantity+=t.quantity;sum.cost+=t.cost;sum.calories+=t.calories;return sum},{quantity:0,cost:0,calories:0});const drinkingDayNumbers=drinkRecords.map(r=>Number(r.key.slice(-2))).sort((a,b)=>a-b),avgGap=calculateAverageGap(drinkingDayNumbers);els.drinkingDays.textContent=`${drinkRecords.length}일`;els.totalQuantity.textContent=`${formatCount(totals.quantity)}개`;els.totalCost.textContent=formatMoney(totals.cost);els.totalCalories.textContent=`${Math.round(totals.calories).toLocaleString("ko-KR")}kcal`;els.soberDays.textContent=`${soberRecords.length}일`;els.avgInterval.textContent=avgGap?`${avgGap}일`:"-";els.soberStreak.textContent=`${calculateSoberStreak()}일`;els.summaryComment.textContent=pickRandomComment();return {totalQuantity:totals.quantity,totalCost:totals.cost,totalCalories:totals.calories,drinkDays:drinkRecords.length}}
function calculateRecordTotals(record){const items=Array.isArray(record?.items)?record.items:[];return items.reduce((sum,item)=>{sum.quantity+=Number(item.quantity||0);sum.cost+=Number(item.cost||0);sum.calories+=Number(item.totalCalories||0);return sum},{quantity:0,cost:0,calories:0})}
function calculateAverageGap(days){if(days.length<2)return null;let total=0;for(let i=1;i<days.length;i++)total+=days[i]-days[i-1];return (total/(days.length-1)).toFixed(1).replace(/\.0$/,"")}
function pickRandomComment(){return commentPool[Math.floor(Math.random()*commentPool.length)]}
// 전체 기록 중 가장 최근 날짜부터 이어진 명시적 금주 기록을 계산합니다.
function calculateSoberStreak(){const todayKey=formatKey(new Date());const keys=Object.keys(state.records).filter(key=>key<=todayKey).sort();if(!keys.length)return 0;const latest=keys[keys.length-1];if(state.records[latest]?.status!=="sober")return 0;let streak=0,cursor=parseDateKey(latest);while(state.records[formatKey(cursor)]?.status==="sober"){streak++;cursor.setDate(cursor.getDate()-1)}return streak}
// 최근 6개월의 음주일 수 또는 술값을 간단한 SVG 막대그래프로 그립니다.
function renderPatternChart(){const months=getRecentMonths(6);const points=months.map(({year,month})=>{const prefix=`${year}-${String(month+1).padStart(2,"0")}`;const records=Object.entries(state.records).filter(([key,record])=>key.startsWith(prefix)&&record.status==="drink");const drinkDays=records.length;const cost=records.reduce((sum,[,record])=>sum+calculateRecordTotals(record).cost,0);return {label:`${month+1}월`,value:state.chartMode==="days"?drinkDays:cost,drinkDays,cost}});const maxValue=Math.max(...points.map(p=>p.value),1);const bars=points.map((p,i)=>{const w=28,g=22,x=28+i*(w+g),h=Math.max(4,(p.value/maxValue)*92),y=116-h,valueLabel=state.chartMode==="days"?`${p.value}일`:`${Math.round(p.value/1000)}천`;return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${i%2?"#9D8BFF":"#6B7FFF"}"></rect><text x="${x+w/2}" y="${Math.max(14,y-7)}" text-anchor="middle" font-size="10" font-weight="800" fill="#27304D">${valueLabel}</text><text x="${x+w/2}" y="140" text-anchor="middle" font-size="10" font-weight="800" fill="#6E7897">${p.label}</text>`}).join("");const caption=state.chartMode==="days"?"음주일 수":"술값";els.patternChart.innerHTML=`<rect x="0" y="0" width="320" height="170" rx="14" fill="#FBFCFF"></rect><line x1="18" y1="118" x2="304" y2="118" stroke="#DDE3FA" stroke-width="2"></line>${bars}<text x="16" y="160" font-size="10" font-weight="800" fill="#6E7897">최근 6개월 · ${caption}</text>`}
function getRecentMonths(count){const months=[];for(let i=count-1;i>=0;i--){const d=new Date(state.currentDate.getFullYear(),state.currentDate.getMonth()-i,1);months.push({year:d.getFullYear(),month:d.getMonth()})}return months}function openModal(key){state.selectedKey=key;const record=state.records[key];els.modalTitle.textContent=formatKoreanDate(key);els.memoInput.value=record?.memo||"";state.selectedItems=record?.status==="drink"?cloneItems(record.items):[createDefaultItem()];setModalStatus(record?.status||"drink",false);els.deleteBtn.classList.toggle("hidden",!record);renderDrinkItems();els.modalBackdrop.classList.add("open")}
function closeModal(){els.modalBackdrop.classList.remove("open");state.selectedKey=null;state.selectedItems=[]}
function setModalStatus(status,shouldRender=true){state.selectedStatus=status;els.soberBtn.classList.toggle("active",status==="sober");els.drinkBtn.classList.toggle("active",status==="drink");els.drinkFields.classList.toggle("hidden",status!=="drink");if(status==="drink"&&state.selectedItems.length===0)state.selectedItems=[createDefaultItem()];if(shouldRender)renderDrinkItems()}
function createDefaultItem(drinkType="beer500"){const c=drinkCatalog[drinkType]||drinkCatalog.other;return {id:randomId(),drinkType,drinkLabel:c.label,quantity:1,unitCalories:c.calories,totalCalories:c.calories,cost:c.price}}
function cloneItems(items){return (items||[]).map(item=>({...item,id:item.id||randomId()}))}
function addDrinkItem(){state.selectedItems.push(createDefaultItem());renderDrinkItems()}
function renderDrinkItems(){if(state.selectedStatus!=="drink")return;if(state.selectedItems.length===0){els.drinkItemList.innerHTML=`<div class="empty-items">술 항목을 추가하면 오늘 총합이 계산됩니다.</div>`;renderDayTotals();return}els.drinkItemList.innerHTML=state.selectedItems.map((item,index)=>`<article class="drink-item" data-id="${item.id}"><div class="drink-item-head"><span>술 항목 ${index+1}</span><button class="item-delete-btn" type="button" data-delete-id="${item.id}">삭제</button></div><div class="item-grid"><label>종류<select data-field="drinkType">${Object.entries(drinkCatalog).map(([key,c])=>`<option value="${key}" ${key===item.drinkType?"selected":""}>${c.label}</option>`).join("")}</select></label><label>수량<input data-field="quantity" type="number" inputmode="decimal" min="0" step="0.5" value="${item.quantity}"></label><label>단위 칼로리<input data-field="unitCalories" type="number" inputmode="numeric" min="0" step="10" value="${Math.round(item.unitCalories||0)}"></label><label>총 칼로리<input data-field="totalCalories" type="number" inputmode="numeric" min="0" step="10" value="${Math.round(item.totalCalories||0)}"></label><label>술값<input data-field="cost" type="number" inputmode="numeric" min="0" step="100" value="${Math.round(item.cost||0)}"></label></div></article>`).join("");renderDayTotals()}
function handleDrinkItemInput(event){const field=event.target.dataset.field;const card=event.target.closest(".drink-item");if(!field||!card)return;const item=state.selectedItems.find(candidate=>candidate.id===card.dataset.id);if(!item)return;if(field==="drinkType"){const c=drinkCatalog[event.target.value]||drinkCatalog.other;item.drinkType=event.target.value;item.drinkLabel=c.label;item.unitCalories=c.calories;item.quantity=Number(item.quantity||0)||1;item.totalCalories=Math.round(item.unitCalories*item.quantity);item.cost=Math.round(c.price*item.quantity);renderDrinkItems();return}const value=Math.max(Number(event.target.value||0),0);item[field]=value;if(field==="quantity"||field==="unitCalories"){item.totalCalories=Math.round(Number(item.unitCalories||0)*Number(item.quantity||0));if(field==="quantity")item.cost=Math.round((drinkCatalog[item.drinkType]||drinkCatalog.other).price*Number(item.quantity||0));renderDrinkItems();return}renderDayTotals()}
function handleDrinkItemDelete(event){const id=event.target.dataset.deleteId;if(!id)return;state.selectedItems=state.selectedItems.filter(item=>item.id!==id);renderDrinkItems()}
function renderDayTotals(){const totals=state.selectedItems.reduce((sum,item)=>{sum.quantity+=Number(item.quantity||0);sum.calories+=Number(item.totalCalories||0);sum.cost+=Number(item.cost||0);return sum},{quantity:0,calories:0,cost:0});els.dayTotalQuantity.textContent=`${formatCount(totals.quantity)}개`;els.dayTotalCalories.textContent=`${Math.round(totals.calories).toLocaleString("ko-KR")}kcal`;els.dayTotalCost.textContent=formatMoney(totals.cost)}
function saveSelectedRecord(){if(!state.selectedKey)return;const memo=els.memoInput.value.trim();if(state.selectedStatus==="sober"){state.records[state.selectedKey]={status:"sober",memo}}else{const items=state.selectedItems.map(cleanItem).filter(item=>item.quantity>0||item.cost>0||item.totalCalories>0);if(items.length===0){alert("술 항목을 하나 이상 추가해 주세요.");return}state.records[state.selectedKey]={status:"drink",items,memo}}saveRecords();closeModal();render()}
function cleanItem(item){const drinkType=drinkCatalog[item.drinkType]?item.drinkType:"other";return {drinkType,drinkLabel:drinkCatalog[drinkType].label,quantity:Math.max(Number(item.quantity||0),0),unitCalories:Math.max(Number(item.unitCalories||0),0),totalCalories:Math.max(Number(item.totalCalories||0),0),cost:Math.max(Number(item.cost||0),0)}}
function deleteSelectedRecord(){if(!state.selectedKey)return;delete state.records[state.selectedKey];saveRecords();closeModal();render()}// 백업용 JSON 파일을 브라우저에서 바로 다운로드합니다.
function exportData(){const payload={app:"술 달력",version:2,exportedAt:new Date().toISOString(),records:state.records};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const link=document.createElement("a");link.href=url;link.download=`drink-calendar-backup-${formatKey(new Date())}.json`;document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(url)}
function importData(event){const file=event.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(String(reader.result));const records=parsed.records&&typeof parsed.records==="object"?parsed.records:parsed;if(!records||typeof records!=="object"||Array.isArray(records))throw new Error("Invalid backup shape");state.records=normalizeImportedRecords(records);saveRecords();render();alert("백업을 불러왔습니다.")}catch(error){alert("JSON 파일을 읽지 못했습니다.");console.warn(error)}finally{els.importFile.value=""}};reader.readAsText(file)}
function normalizeImportedRecords(records){const normalized={};Object.entries(records||{}).forEach(([key,record])=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(key)||!record||typeof record!=="object")return;const memo=typeof record.memo==="string"?record.memo:"";if(record.status==="sober"){normalized[key]={status:"sober",memo};return}if(record.status!=="drink")return;const items=Array.isArray(record.items)?record.items.map(normalizeItem).filter(Boolean):[normalizeLegacyDrinkRecord(record)].filter(Boolean);normalized[key]={status:"drink",items,memo}});return normalized}
function normalizeItem(item){if(!item||typeof item!=="object")return null;const drinkType=drinkCatalog[item.drinkType]?item.drinkType:"other";const quantity=Math.max(Number(item.quantity||0),0);const unitCalories=Math.max(Number(item.unitCalories??drinkCatalog[drinkType].calories),0);const totalCalories=Math.max(Number(item.totalCalories??unitCalories*quantity),0);const cost=Math.max(Number(item.cost||0),0);return {drinkType,drinkLabel:drinkCatalog[drinkType].label,quantity,unitCalories,totalCalories,cost}}
function normalizeLegacyDrinkRecord(record){const drinkType=drinkCatalog[record.drinkType]?record.drinkType:"other";const quantity=Math.max(Number(record.quantity||0),0);const totalCalories=Math.max(Number(record.calories||drinkCatalog[drinkType].calories*quantity),0);const unitCalories=quantity>0?Math.round(totalCalories/quantity):drinkCatalog[drinkType].calories;const cost=Math.max(Number(record.cost||0),0);return {drinkType,drinkLabel:drinkCatalog[drinkType].label,quantity,unitCalories,totalCalories,cost}}
function resetAllData(){if(!confirm("모든 술 기록을 삭제할까요? 이 작업은 되돌릴 수 없습니다."))return;state.records={};localStorage.removeItem(STORAGE_KEY);render()}
</script>
